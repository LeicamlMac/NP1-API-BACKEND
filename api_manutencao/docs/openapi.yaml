  /api/manutencoes-preventivas/vencidas/:
    get:
      operationId: manutencoes_preventivas_vencidas_list
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Alertas de manutenções vencidas (Problema 3)
      parameters:
      - in: query
        name: equipamento
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
