components:
  schemas:
    Alertas:
      type: object
      properties:
        gerado_em:
          type: string
          format: date-time
        totais:
          type: object
          additionalProperties:
            type: integer
        manutencoes_vencidas:
          type: array
          items:
            $ref: '#/components/schemas/ManutencaoPreventiva'
        defeitos_criticos:
          type: array
          items:
            $ref: '#/components/schemas/Defeito'
        equipamentos_em_manutencao:
          type: array
          items:
            $ref: '#/components/schemas/Equipamento'
      required:
      - defeitos_criticos
      - equipamentos_em_manutencao
      - gerado_em
      - manutencoes_vencidas
      - totais
    CustoTotal:
      type: object
      properties:
        ordem_servico:
          type: integer
        equipamento:
          type: string
        quantidade_itens:
          type: integer
        quantidade_pecas:
          type: integer
        custo_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        itens:
          type: array
          items:
            $ref: '#/components/schemas/PecaSubstituida'
      required:
      - custo_total
      - equipamento
      - itens
      - ordem_servico
      - quantidade_itens
      - quantidade_pecas
    Defeito:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipamento:
          type: integer
        equipamento_nome:
          type: string
          readOnly: true
        descricao:
          type: string
        severidade:
          $ref: '#/components/schemas/SeveridadeEnum'
        severidade_display:
          type: string
          readOnly: true
        prioridade:
          type: integer
          readOnly: true
          description: 1 = Crítico (mais urgente) ... 4 = Baixo
        critico:
          type: boolean
          readOnly: true
        alerta:
          type: string
          nullable: true
          readOnly: true
        data_registro:
          type: string
          format: date
      required:
      - alerta
      - critico
      - descricao
      - equipamento
      - equipamento_nome
      - id
      - prioridade
      - severidade
      - severidade_display
    DefeitoRequest:
      type: object
      properties:
        equipamento:
          type: integer
        descricao:
          type: string
          minLength: 1
        severidade:
          $ref: '#/components/schemas/SeveridadeEnum'
        data_registro:
          type: string
          format: date
      required:
      - descricao
      - equipamento
      - severidade
    Equipamento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        modelo:
          type: string
          maxLength: 80
        fabricante:
          type: string
          maxLength: 80
        data_instalacao:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/StatusEquipamentoEnum'
        status_display:
          type: string
          readOnly: true
      required:
      - data_instalacao
      - fabricante
      - id
      - modelo
      - nome
      - status_display
    EquipamentoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        modelo:
          type: string
          minLength: 1
          maxLength: 80
        fabricante:
          type: string
          minLength: 1
          maxLength: 80
        data_instalacao:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/StatusEquipamentoEnum'
      required:
      - data_instalacao
      - fabricante
      - modelo
      - nome
    Erro:
      type: object
      properties:
        erro:
          type: string
        status:
          type: integer
        detalhes:
          type: object
          additionalProperties: {}
      required:
      - erro
      - status
    FinalizarOrdemRequest:
      type: object
      properties:
        data_conclusao:
          type: string
          format: date
    ManutencaoPreventiva:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipamento:
          type: integer
        equipamento_nome:
          type: string
          readOnly: true
        descricao:
          type: string
          maxLength: 200
        periodicidade_dias:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        ultima_manutencao:
          type: string
          format: date
        proxima_manutencao:
          type: string
          format: date
          description: 'Se omitida, é calculada: última manutenção + periodicidade.'
        vencida:
          type: boolean
          readOnly: true
        dias_em_atraso:
          type: integer
          readOnly: true
        alerta:
          type: string
          nullable: true
          readOnly: true
      required:
      - alerta
      - descricao
      - dias_em_atraso
      - equipamento
      - equipamento_nome
      - id
      - periodicidade_dias
      - ultima_manutencao
      - vencida
    ManutencaoPreventivaRequest:
      type: object
      properties:
        equipamento:
          type: integer
        descricao:
          type: string
          minLength: 1
          maxLength: 200
        periodicidade_dias:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        ultima_manutencao:
          type: string
          format: date
        proxima_manutencao:
          type: string
          format: date
          description: 'Se omitida, é calculada: última manutenção + periodicidade.'
      required:
      - descricao
      - equipamento
      - periodicidade_dias
      - ultima_manutencao
    OrdemServico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipamento:
          type: integer
        equipamento_nome:
          type: string
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        tipo_display:
          type: string
          readOnly: true
        descricao:
          type: string
        data_abertura:
          type: string
          format: date
        data_conclusao:
          type: string
          format: date
          nullable: true
        responsavel:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusOrdemServicoEnum'
        status_display:
          type: string
          readOnly: true
        manutencao_preventiva:
          type: integer
          nullable: true
        custo_total_pecas:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/PecaSubstituida'
          readOnly: true
      required:
      - custo_total_pecas
      - equipamento
      - equipamento_nome
      - id
      - pecas
      - responsavel
      - status_display
      - tipo
      - tipo_display
    OrdemServicoRequest:
      type: object
      properties:
        equipamento:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        descricao:
          type: string
        data_abertura:
          type: string
          format: date
        data_conclusao:
          type: string
          format: date
          nullable: true
        responsavel:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusOrdemServicoEnum'
        manutencao_preventiva:
          type: integer
          nullable: true
      required:
      - equipamento
      - responsavel
      - tipo
    PatchedDefeitoRequest:
      type: object
      properties:
        equipamento:
          type: integer
        descricao:
          type: string
          minLength: 1
        severidade:
          $ref: '#/components/schemas/SeveridadeEnum'
        data_registro:
          type: string
          format: date
    PatchedEquipamentoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        modelo:
          type: string
          minLength: 1
          maxLength: 80
        fabricante:
          type: string
          minLength: 1
          maxLength: 80
        data_instalacao:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/StatusEquipamentoEnum'
    PatchedManutencaoPreventivaRequest:
      type: object
      properties:
        equipamento:
          type: integer
        descricao:
          type: string
          minLength: 1
          maxLength: 200
        periodicidade_dias:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        ultima_manutencao:
          type: string
          format: date
        proxima_manutencao:
          type: string
          format: date
          description: 'Se omitida, é calculada: última manutenção + periodicidade.'
    PatchedOrdemServicoRequest:
      type: object
      properties:
        equipamento:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        descricao:
          type: string
        data_abertura:
          type: string
          format: date
        data_conclusao:
          type: string
          format: date
          nullable: true
        responsavel:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusOrdemServicoEnum'
        manutencao_preventiva:
          type: integer
          nullable: true
    PatchedPecaSubstituidaRequest:
      type: object
      properties:
        ordem_servico:
          type: integer
        nome:
          type: string
          minLength: 1
          maxLength: 120
        codigo:
          type: string
          minLength: 1
          maxLength: 40
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        custo_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    PecaSubstituida:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ordem_servico:
          type: integer
        nome:
          type: string
          maxLength: 120
        codigo:
          type: string
          maxLength: 40
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        custo_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - codigo
      - custo_unitario
      - id
      - nome
      - ordem_servico
      - quantidade
      - subtotal
    PecaSubstituidaRequest:
      type: object
      properties:
        ordem_servico:
          type: integer
        nome:
          type: string
          minLength: 1
          maxLength: 120
        codigo:
          type: string
          minLength: 1
          maxLength: 40
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        custo_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - codigo
      - custo_unitario
      - nome
      - ordem_servico
      - quantidade
    RegistrarExecucaoRequest:
      type: object
      properties:
        data:
          type: string
          format: date
    SeveridadeEnum:
      enum:
      - BAIXO
      - MEDIO
      - ALTO
      - CRITICO
      type: string
      description: |-
        * `BAIXO` - Baixo
        * `MEDIO` - Médio
        * `ALTO` - Alto
        * `CRITICO` - Crítico
    StatusEquipamentoEnum:
      enum:
      - ATIVO
      - EM_MANUTENCAO
      - INATIVO
      type: string
      description: |-
        * `ATIVO` - Ativo
        * `EM_MANUTENCAO` - Em manutenção
        * `INATIVO` - Inativo
    StatusOrdemServicoEnum:
      enum:
      - ABERTA
      - EM_ANDAMENTO
      - FINALIZADA
      type: string
      description: |-
        * `ABERTA` - Aberta
        * `EM_ANDAMENTO` - Em andamento
        * `FINALIZADA` - Finalizada
    TipoEnum:
      enum:
      - PREVENTIVA
      - CORRETIVA
      type: string
      description: |-
        * `PREVENTIVA` - Preventiva
        * `CORRETIVA` - Corretiva
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
