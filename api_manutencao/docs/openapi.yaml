openapi: 3.0.3
info:
  title: API de Controle de Manutenção Industrial
  version: 1.0.0
  description: API RESTful para gerenciamento de equipamentos, ordens de serviço,
    defeitos, manutenções preventivas e peças substituídas. Projeto NP1 - Desenvolvimento
    Web Back-End.
paths:
  /api/alertas/:
    get:
      operationId: alertas_retrieve
      description: 'Resumo: manutenções vencidas, defeitos críticos e equipamentos
        em manutenção.'
      summary: Painel de alertas
      tags:
      - alertas
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alertas'
          description: ''
  /api/defeitos/:
    get:
      operationId: defeitos_list
      description: 'Problema 5: por padrão os CRÍTICOS aparecem primeiro. Filtros:
        `?severidade=`, `?equipamento=`.'
      summary: Listar defeitos (ordenados por prioridade)
      parameters:
      - in: query
        name: equipamento
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: severidade
        schema:
          type: string
          enum:
          - ALTO
          - BAIXO
          - CRITICO
          - MEDIO
        description: |-
          * `BAIXO` - Baixo
          * `MEDIO` - Médio
          * `ALTO` - Alto
          * `CRITICO` - Crítico
      tags:
      - defeitos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Defeito'
          description: ''
    post:
      operationId: defeitos_create
      description: Defeito CRÍTICO retorna campo `alerta` preenchido.
      summary: Registrar defeito
      tags:
      - defeitos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defeito'
          description: ''
  /api/defeitos/{id}/:
    get:
      operationId: defeitos_retrieve
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Detalhar defeito
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este defeito.
        required: true
      tags:
      - defeitos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defeito'
          description: ''
    put:
      operationId: defeitos_update
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Atualizar defeito
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este defeito.
        required: true
      tags:
      - defeitos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefeitoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defeito'
          description: ''
    patch:
      operationId: defeitos_partial_update
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Atualizar defeito (parcial)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este defeito.
        required: true
      tags:
      - defeitos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDefeitoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDefeitoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDefeitoRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defeito'
          description: ''
    delete:
      operationId: defeitos_destroy
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Excluir defeito
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este defeito.
        required: true
      tags:
      - defeitos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/defeitos/criticos/:
    get:
      operationId: defeitos_criticos_list
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
