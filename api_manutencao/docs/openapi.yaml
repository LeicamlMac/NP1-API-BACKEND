  /api/ordens-servico/:
    get:
      operationId: ordens_servico_list
      description: 'Filtros: `?status=`, `?tipo=`, `?equipamento=`.'
      summary: Listar ordens de serviço
      parameters:
      - in: query
        name: equipamento
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - in: query
        name: responsavel
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABERTA
          - EM_ANDAMENTO
          - FINALIZADA
        description: |-
          * `ABERTA` - Aberta
          * `EM_ANDAMENTO` - Em andamento
          * `FINALIZADA` - Finalizada
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - CORRETIVA
          - PREVENTIVA
        description: |-
          * `PREVENTIVA` - Preventiva
          * `CORRETIVA` - Corretiva
      tags:
      - ordens-servico
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdemServico'
          description: ''
    post:
      operationId: ordens_servico_create
      description: 'Problema 2: retorna **400** se o equipamento não existir. O equipamento
        passa automaticamente para EM_MANUTENCAO.'
      summary: Abrir ordem de serviço
      tags:
      - ordens-servico
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrdemServicoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrdemServicoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
