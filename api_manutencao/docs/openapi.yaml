                items:
                  $ref: '#/components/schemas/Equipamento'
          description: ''
  /api/manutencoes-preventivas/:
    get:
      operationId: manutencoes_preventivas_list
      description: 'Filtro: `?vencida=true`.'
      summary: Listar planos de manutenção preventiva
      parameters:
      - in: query
        name: equipamento
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: vencida
        schema:
          type: boolean
        description: Somente vencidas (true/false)
      tags:
      - manutencoes-preventivas
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManutencaoPreventiva'
          description: ''
    post:
      operationId: manutencoes_preventivas_create
      description: '`proxima_manutencao` é calculada automaticamente se omitida.'
      summary: Cadastrar plano preventivo
      tags:
      - manutencoes-preventivas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManutencaoPreventivaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManutencaoPreventivaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManutencaoPreventivaRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutencaoPreventiva'
          description: ''
  /api/manutencoes-preventivas/{id}/:
    get:
      operationId: manutencoes_preventivas_retrieve
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
