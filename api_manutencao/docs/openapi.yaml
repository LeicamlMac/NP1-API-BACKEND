      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
  /api/equipamentos/em-manutencao/:
    get:
      operationId: equipamentos_em_manutencao_list
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Equipamentos em manutenção (Problema 7)
      parameters:
      - in: query
        name: fabricante
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ATIVO
          - EM_MANUTENCAO
          - INATIVO
        description: |-
          * `ATIVO` - Ativo
          * `EM_MANUTENCAO` - Em manutenção
          * `INATIVO` - Inativo
      tags:
