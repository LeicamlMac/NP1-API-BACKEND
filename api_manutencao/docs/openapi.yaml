  /api/manutencoes-preventivas/{id}/registrar-execucao/:
    post:
      operationId: manutencoes_preventivas_registrar_execucao_create
      description: 'Atualiza `ultima_manutencao` (padrão: hoje) e recalcula `proxima_manutencao`.'
      summary: Registrar execução da preventiva
      parameters:
      - in: path
        name: id
        schema:
          type: integer
