        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: severidade
        schema:
          type: string
          enum:
          - ALTO
          - BAIXO
          - CRITICO
          - MEDIO
        description: |-
          * `BAIXO` - Baixo
          * `MEDIO` - Médio
          * `ALTO` - Alto
          * `CRITICO` - Crítico
      tags:
      - defeitos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Defeito'
          description: ''
  /api/equipamentos/:
    get:
      operationId: equipamentos_list
      description: 'Filtros: `?status=EM_MANUTENCAO`, `?fabricante=`, `?search=`.'
      summary: Listar equipamentos
      parameters:
      - in: query
        name: fabricante
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ATIVO
          - EM_MANUTENCAO
          - INATIVO
        description: |-
          * `ATIVO` - Ativo
          * `EM_MANUTENCAO` - Em manutenção
          * `INATIVO` - Inativo
      tags:
      - equipamentos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipamento'
          description: ''
    post:
      operationId: equipamentos_create
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Cadastrar equipamento
      tags:
      - equipamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
  /api/equipamentos/{id}/:
    get:
      operationId: equipamentos_retrieve
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Detalhar equipamento
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este equipamento.
        required: true
      tags:
      - equipamentos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ID inválido ou dados inválidos
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Recurso não encontrado
    put:
      operationId: equipamentos_update
      description: 'Problema 1: corrigir cadastro incorreto.'
      summary: Atualizar equipamento (completo)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este equipamento.
        required: true
      tags:
      - equipamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipamentoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
    patch:
      operationId: equipamentos_partial_update
      description: CRUD padrão com tratamento de 'ID inválido' (400) e 'não encontrado'
        (404).
      summary: Atualizar equipamento (parcial)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este equipamento.
        required: true
      tags:
      - equipamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEquipamentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEquipamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEquipamentoRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
    delete:
      operationId: equipamentos_destroy
      description: 'Problema 6: retorna **409** se houver OS ou defeitos vinculados.'
      summary: Excluir equipamento
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este equipamento.
        required: true
      tags:
      - equipamentos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Possui vínculos
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ID inválido ou dados inválidos
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Recurso não encontrado
  /api/equipamentos/{id}/historico/:
    get:
      operationId: equipamentos_historico_retrieve
      description: Ordens de serviço, defeitos e planos preventivos do equipamento.
      summary: Histórico completo do equipamento
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este equipamento.
        required: true
      tags:
